# Deploy the FastAPI app on Render with an existing hosted FalkorDB Cloud DB.
# Set missing secrets (including OPERATOR_TOKEN, FALKOR_HOST and PASSWORD) in Render.
# No SQLite/in-memory graph is substituted when hosted FalkorDB is unavailable.
services:
  - type: web
    name: maelin-graph-hacks
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FALKOR_HOST
        sync: false
      - key: FALKOR_PORT
        sync: false
      - key: FALKOR_USERNAME
        sync: false
      - key: FALKOR_PASSWORD
        sync: false
      - key: FALKOR_SSL
        value: "1"
      - key: MAELIN_OPERATOR_TOKEN
        sync: false
      - key: MAELIN_AGENT_TOOLS
        value: mcp
      - key: MAELIN_USE_LLM
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: MAELIN_LLM_MODEL
        value: gpt-4o-mini
