name: MAELIN real FalkorDB verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test and FalkorDB clients
        run: pip install -r requirements-dev.txt -r requirements.txt
      - name: Start real FalkorDB, not a mock
        run: docker compose up -d graph
      - name: Wait for FalkorDB to accept protocol queries
        run: |
          python - <<'PY'
          import time
          from falkordb import FalkorDB
          db=FalkorDB(host='localhost',port=6379)
          for i in range(45):
              try:
                  db.list_graphs()
                  print('FalkorDB is ready')
                  break
              except Exception:
                  if i==44: raise
                  time.sleep(2)
          PY
      - name: Test offline invariants and live graph copy, Cypher, memory isolation, replay
        env:
          FALKOR_INTEGRATION: '1'
          FALKOR_HOST: localhost
          FALKOR_PORT: '6379'
        run: python -m pytest -q
      - name: Reproduce both track proofs on disposable live FalkorDB graphs
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: '6379'
        run: python -m maelin.judge --output judge-proof.json
      - name: Preserve machine-readable live evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maelin-dual-track-evidence
          path: judge-proof.json
      - name: Install real browser automation
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Boot Dockerized Maelin API and seed real FalkorDB demo tenants
        run: |
          docker compose up -d --build app
          docker compose exec -T app python -m maelin.seed --tenant alpha
          docker compose exec -T app python -m maelin.seed --tenant beta
      - name: Replay the complete UI journey against real API and FalkorDB
        run: python tests/e2e_real_browser.py
      - name: Preserve real browser captures for judge review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maelin-real-browser-proof
          path: browser_artifacts/
          if-no-files-found: warn
      - name: Show graph container logs if CI fails
        if: failure()
        run: docker compose logs --tail=150 graph
      - name: Shut down containers
        if: always()
        run: docker compose down -v
