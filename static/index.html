<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maelin — incident decisions on FalkorDB</title>
<meta name="description" content="MAELIN: see what breaks before you fix it. Graph-native incident response on FalkorDB.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/cockpit.css">
<style>
select, .pick select {
  color-scheme: light !important;
}
select option,
.pick select option,
.pick.v select option,
.pick.t select option {
  color: #0b0c10 !important;
  background-color: #ffffff !important;
  -webkit-text-fill-color: #0b0c10 !important;
  font-weight: 500 !important;
}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='16' r='4' fill='%23ff6b5b'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%239b8cff'/%3E%3Ccircle cx='23' cy='23' r='4' fill='%233ee6b0'/%3E%3Cpath d='M12 14l8-4M12 18l8 4' stroke='%23fff' stroke-opacity='.6' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <path class="mark-edge" d="M9 16L23 9M9 16L23 23"/>
      <circle cx="9" cy="16" r="4" class="m1"/><circle cx="23" cy="9" r="4" class="m2"/><circle cx="23" cy="23" r="4" class="m3"/>
    </svg>
    <span class="word">MAELIN</span>
    <span class="tag">incident decisions on FalkorDB</span>
  </div>

  <div class="seg" id="tenantSeg" role="tablist" aria-label="Tenant">
    <span class="seg-ink"></span>
    <button role="tab" data-tenant="alpha" class="on">alpha</button>
    <button role="tab" data-tenant="beta">beta</button>
  </div>

  <div class="bar-right">
    <div class="live" id="connectivity" title="FalkorDB connection">
      <span class="dot"></span><span id="liveText">connecting</span>
    </div>
    <button class="kbd-btn" id="openPalette" title="Command palette">
      <span>Commands</span><kbd>⌘K</kbd>
    </button>
    <button class="icon-btn" id="resetDemo" title="Reset demo state" aria-label="Reset demo state">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
    </button>
  </div>
</header>

<main class="stage">
  <section class="canvas" id="canvas">
    <svg id="graph" role="img" aria-label="Infrastructure and attack graph"></svg>

    <div class="hud hud-tl" id="intel"></div>
    <div class="hud hud-tr">
      <div class="legend">
        <span><i class="lg lg-threat"></i>attack route</span>
        <span><i class="lg lg-dep"></i>customer dependency</span>
        <span><i class="lg lg-cut"></i>cut</span>
      </div>
    </div>

    <nav class="rail" id="rail" aria-label="Progress">
      <span class="rail-ink"></span>
      <button data-step="0"><b>1</b>Investigate</button>
      <button data-step="1"><b>2</b>Compare</button>
      <button data-step="2"><b>3</b>Replay</button>
      <button data-step="3"><b>4</b>Remember</button>
    </nav>

    <div class="tip" id="tip" role="tooltip"></div>
  </section>

  <aside class="panel" aria-label="Context">
    <div class="tabs" id="tabs" role="tablist">
      <span class="tabs-ink"></span>
      <button role="tab" data-tab="respond" class="on">Respond</button>
      <button role="tab" data-tab="memory">Memory</button>
      <button role="tab" data-tab="brain">Brain</button>
    </div>
    <div class="views">
      <div class="view on" id="view-respond"></div>
      <div class="view" id="view-memory"></div>
      <div class="view" id="view-brain"></div>
    </div>
  </aside>
</main>

<div class="palette" id="palette" hidden>
  <div class="palette-card" role="dialog" aria-label="Command palette">
    <input id="paletteInput" placeholder="Type a command or ask the company brain…" autocomplete="off" spellcheck="false">
    <ul id="paletteList" role="listbox"></ul>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/assets/cockpit.js"></script>
</body>
</html>
