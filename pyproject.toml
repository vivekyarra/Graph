[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maelin"
version = "0.1.0"
description = "Graph-native incident decision and counterfactual simulation engine on FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Team Pied-Piper", email = "kittusontineni@gmail.com" }
]
keywords = [
    "falkordb",
    "graph-algorithms",
    "incident-response",
    "counterfactual-reasoning",
    "cypher",
    "mcp",
    "fastmcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "falkordb>=1.0.8",
    "pydantic>=2.6.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0"
]
llm = [
    "openai>=1.12.0",
    "google-genai>=0.1.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
